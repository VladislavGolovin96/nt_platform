<svg viewBox="0 0 1900 1000" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="aF" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <marker id="aO" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#666" stroke-width="1.5"/>
    </marker>
    <marker id="aB" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#444"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000022"/>
    </filter>
  </defs>

  <!--
    COORDINATE PLAN
    ───────────────────────────────────────────────────────────────
    viewBox: 1900 x 1000

    LEFT EXTERNAL  x=20..200   (API Gateway cy=260, Kafka cy=460)
    CONTAINER      x=220..1260  (inner components)
    RIGHT EXTERNAL x=1280..1500 (PostgreSQL, Kafka OUT, MongoDB,
                                  Valkey, MinIO)  — fits inside viewBox

    Component columns (cx):
      Col L  cx=420   rows: R1 y=145, R2 y=295, R3 y=445, R4 y=595
      Col M  cx=740   rows: R1 y=145, R2 y=295, R3 y=445, R4 y=595
      Col R  cx=1060  rows: R1 y=145  (ExecutionRepository only)

    All component boxes:  w=240 h=110

    gatling-results: inside container bottom, y=750  cx=740

    DRAW ORDER:
      1. Background rect
      2. Zone backgrounds (left-ext, container, right-ext)
      3. ARROWS  ← key fix: AFTER zone BGs, BEFORE component blocks
      4. Component blocks (on top)
      5. Legend
  -->

  <!-- ① Background -->
  <rect width="1900" height="1000" fill="#f0f2f5"/>

  <!-- Title -->
  <text x="860" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a2e">NT Platform — Component Diagram: Execution Service [C4 Level 3]</text>
  <text x="860" y="55" text-anchor="middle" font-size="11" fill="#666">C4 Model · Level 3 · Component Diagram</text>

  <!-- ② ZONE BACKGROUNDS -->

  <!-- Left external zone -->
  <rect x="18" y="180" width="196" height="340" rx="10" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.2"/>
  <text x="116" y="198" text-anchor="middle" font-size="9" font-weight="bold" fill="#5c6bc0">ВНЕШНИЕ (IN)</text>

  <!-- Execution Service container -->
  <rect x="224" y="88" width="1040" height="760" rx="14" fill="#daeeff" stroke="#64b5f6" stroke-width="2.5"/>
  <text x="744" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">Execution Service</text>
  <text x="744" y="133" text-anchor="middle" font-size="10" fill="#1565C0">[Container: Spring Boot · :8083]</text>

  <!-- gatling-results zone (inside container) -->
  <rect x="570" y="740" width="350" height="86" rx="10" fill="#eeeeee" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Right external zone -->
  <rect x="1278" y="88" width="200" height="760" rx="10" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="1378" y="107" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e7d32">ВНЕШНИЕ (OUT)</text>

  <!-- ③ ARROWS — drawn after zone BGs, before component blocks -->

  <!-- API Gateway → ExecutionController -->
  <line x1="214" y1="248" x2="300" y2="200" stroke="#444" stroke-width="2" marker-end="url(#aF)"/>

  <!-- Kafka IN → ProjectEventConsumer -->
  <line x1="214" y1="448" x2="620" y2="200" stroke="#444" stroke-width="2" marker-end="url(#aF)"/>

  <!-- ExecutionController → ExecutionService -->
  <line x1="420" y1="255" x2="420" y2="295" stroke="#444" stroke-width="2" marker-end="url(#aF)"/>

  <!-- ExecutionService → ExecutionPipelineService -->
  <line x1="420" y1="405" x2="420" y2="445" stroke="#444" stroke-width="2" marker-end="url(#aF)"/>

  <!-- ExecutionService → ExecutionRepository -->
  <line x1="540" y1="330" x2="940" y2="200" stroke="#444" stroke-width="1.8" marker-end="url(#aF)"/>

  <!-- ExecutionPipelineService → GatlingRunner -->
  <line x1="420" y1="555" x2="420" y2="595" stroke="#444" stroke-width="2" marker-end="url(#aF)"/>

  <!-- ExecutionPipelineService → ExecutionKafkaProducer -->
  <line x1="540" y1="488" x2="620" y2="345" stroke="#444" stroke-width="1.8" marker-end="url(#aF)"/>

  <!-- ExecutionPipelineService → LogRepository -->
  <line x1="552" y1="503" x2="620" y2="495" stroke="#444" stroke-width="1.8" marker-end="url(#aF)"/>

  <!-- ExecutionPipelineService → StatusCacheService -->
  <line x1="540" y1="515" x2="620" y2="640" stroke="#444" stroke-width="1.8" marker-end="url(#aF)"/>

  <!-- ExecutionPipelineService → MinIO (скачать артефакт) -->
  <line x1="542" y1="500" x2="1278" y2="780" stroke="#444" stroke-width="1.8" marker-end="url(#aF)"/>
  <rect x="830" y="596" width="148" height="14" rx="3" fill="#daeeff" opacity="0.95"/>
  <text x="904" y="607" text-anchor="middle" font-size="8.5" fill="#333">скачать артефакт</text>

  <!-- GatlingRunner → gatling-results volume -->
  <line x1="490" y1="705" x2="620" y2="763" stroke="#444" stroke-width="2" marker-end="url(#aF)"/>
  <rect x="484" y="726" width="140" height="14" rx="3" fill="#daeeff" opacity="0.95"/>
  <text x="554" y="737" text-anchor="middle" font-size="8.5" fill="#333">записывает результаты</text>

  <!-- ExecutionKafkaProducer → Kafka OUT [async dashed] -->
  <line x1="860" y1="340" x2="1278" y2="358" stroke="#666" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#aO)"/>
  <rect x="1020" y="330" width="56" height="14" rx="3" fill="#daeeff" opacity="0.95"/>
  <text x="1048" y="341" text-anchor="middle" font-size="8.5" fill="#555">[async]</text>

  <!-- ExecutionRepository ↔ PostgreSQL -->
  <line x1="1180" y1="200" x2="1278" y2="210" stroke="#444" stroke-width="2" marker-start="url(#aB)" marker-end="url(#aF)"/>

  <!-- LogRepository ↔ MongoDB -->
  <line x1="860" y1="503" x2="1278" y2="503" stroke="#444" stroke-width="2" marker-start="url(#aB)" marker-end="url(#aF)"/>

  <!-- StatusCacheService ↔ Valkey/Redis -->
  <line x1="860" y1="660" x2="1278" y2="653" stroke="#444" stroke-width="2" marker-start="url(#aB)" marker-end="url(#aF)"/>

  <!-- ④ COMPONENT BLOCKS — drawn last, on top of everything -->

  <!-- ── External LEFT ── -->
  <g filter="url(#sh)">
    <rect x="24" y="208" width="168" height="100" rx="10" fill="#1565C0" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="108" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="white">API Gateway</text>
    <text x="108" y="254" text-anchor="middle" font-size="9" fill="#90caf9">[Container]</text>
    <text x="108" y="270" text-anchor="middle" font-size="9" fill="#cce5ff">:8080</text>
  </g>

  <g filter="url(#sh)">
    <rect x="24" y="398" width="168" height="100" rx="10" fill="#f9a825" stroke="#f57f17" stroke-width="1.5"/>
    <text x="108" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#3e2000">Kafka</text>
    <text x="108" y="444" text-anchor="middle" font-size="9" fill="#5d3b00">[Container]</text>
    <text x="108" y="460" text-anchor="middle" font-size="9" fill="#4a2c00">topic: project.built</text>
  </g>

  <!-- ── Col L: cx=420 ── -->
  <!-- ExecutionController -->
  <g filter="url(#sh)">
    <rect x="300" y="145" width="240" height="110" rx="10" fill="#1e88e5" stroke="#1565C0" stroke-width="1.5"/>
    <text x="420" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ExecutionController</text>
    <text x="420" y="190" text-anchor="middle" font-size="9" fill="#90caf9">[Component]</text>
    <text x="420" y="207" text-anchor="middle" font-size="8.5" fill="#e3f2fd">POST /executions</text>
    <text x="420" y="221" text-anchor="middle" font-size="8.5" fill="#e3f2fd">GET /{id}/logs (SSE) · POST /{id}/stop</text>
  </g>

  <!-- ExecutionService -->
  <g filter="url(#sh)">
    <rect x="300" y="295" width="240" height="110" rx="10" fill="#1e88e5" stroke="#1565C0" stroke-width="1.5"/>
    <text x="420" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ExecutionService</text>
    <text x="420" y="340" text-anchor="middle" font-size="9" fill="#90caf9">[Component]</text>
    <text x="420" y="357" text-anchor="middle" font-size="8.5" fill="#e3f2fd">Бизнес-логика:</text>
    <text x="420" y="371" text-anchor="middle" font-size="8.5" fill="#e3f2fd">создание, статус, история, остановка</text>
  </g>

  <!-- ExecutionPipelineService -->
  <g filter="url(#sh)">
    <rect x="300" y="445" width="240" height="110" rx="10" fill="#1e88e5" stroke="#1565C0" stroke-width="1.5"/>
    <text x="420" y="473" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ExecutionPipeline</text>
    <text x="420" y="489" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Service</text>
    <text x="420" y="506" text-anchor="middle" font-size="9" fill="#90caf9">[Component]</text>
    <text x="420" y="522" text-anchor="middle" font-size="8.5" fill="#e3f2fd">Оркестрация: скачать → запустить → логи</text>
  </g>

  <!-- GatlingRunner -->
  <g filter="url(#sh)">
    <rect x="300" y="595" width="240" height="110" rx="10" fill="#1e88e5" stroke="#1565C0" stroke-width="1.5"/>
    <text x="420" y="623" text-anchor="middle" font-size="12" font-weight="bold" fill="white">GatlingRunner</text>
    <text x="420" y="640" text-anchor="middle" font-size="9" fill="#90caf9">[Component]</text>
    <text x="420" y="657" text-anchor="middle" font-size="8.5" fill="#e3f2fd">ProcessBuilder:</text>
    <text x="420" y="671" text-anchor="middle" font-size="8.5" fill="#e3f2fd">java -cp ... Gatling -rf /tmp/gatling-results/{id}</text>
  </g>

  <!-- ── Col M: cx=740 ── -->
  <!-- ProjectEventConsumer -->
  <g filter="url(#sh)">
    <rect x="620" y="145" width="240" height="110" rx="10" fill="#1e88e5" stroke="#1565C0" stroke-width="1.5"/>
    <text x="740" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ProjectEvent</text>
    <text x="740" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Consumer</text>
    <text x="740" y="207" text-anchor="middle" font-size="9" fill="#90caf9">[Component]</text>
    <text x="740" y="223" text-anchor="middle" font-size="8.5" fill="#e3f2fd">@KafkaListener: project.built → кэш artifact path</text>
  </g>

  <!-- ExecutionKafkaProducer -->
  <g filter="url(#sh)">
    <rect x="620" y="295" width="240" height="110" rx="10" fill="#1e88e5" stroke="#1565C0" stroke-width="1.5"/>
    <text x="740" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ExecutionKafka</text>
    <text x="740" y="339" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Producer</text>
    <text x="740" y="357" text-anchor="middle" font-size="9" fill="#90caf9">[Component]</text>
    <text x="740" y="373" text-anchor="middle" font-size="8.5" fill="#e3f2fd">test.started · test.log.{id} · test.finished · test.failed</text>
  </g>

  <!-- LogRepository -->
  <g filter="url(#sh)">
    <rect x="620" y="445" width="240" height="110" rx="10" fill="#1e88e5" stroke="#1565C0" stroke-width="1.5"/>
    <text x="740" y="473" text-anchor="middle" font-size="12" font-weight="bold" fill="white">LogRepository</text>
    <text x="740" y="490" text-anchor="middle" font-size="9" fill="#90caf9">[Component]</text>
    <text x="740" y="508" text-anchor="middle" font-size="8.5" fill="#e3f2fd">Spring Data MongoDB</text>
    <text x="740" y="522" text-anchor="middle" font-size="8.5" fill="#e3f2fd">→ MongoDB</text>
  </g>

  <!-- StatusCacheService -->
  <g filter="url(#sh)">
    <rect x="620" y="595" width="240" height="110" rx="10" fill="#1e88e5" stroke="#1565C0" stroke-width="1.5"/>
    <text x="740" y="623" text-anchor="middle" font-size="12" font-weight="bold" fill="white">StatusCacheService</text>
    <text x="740" y="640" text-anchor="middle" font-size="9" fill="#90caf9">[Component]</text>
    <text x="740" y="658" text-anchor="middle" font-size="8.5" fill="#e3f2fd">Spring Data Redis</text>
    <text x="740" y="672" text-anchor="middle" font-size="8.5" fill="#e3f2fd">execution:status:{id}</text>
  </g>

  <!-- ── Col R: cx=1060 ── -->
  <!-- ExecutionRepository -->
  <g filter="url(#sh)">
    <rect x="940" y="145" width="240" height="110" rx="10" fill="#1e88e5" stroke="#1565C0" stroke-width="1.5"/>
    <text x="1060" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Execution</text>
    <text x="1060" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Repository</text>
    <text x="1060" y="207" text-anchor="middle" font-size="9" fill="#90caf9">[Component]</text>
    <text x="1060" y="223" text-anchor="middle" font-size="8.5" fill="#e3f2fd">Spring Data JPA → PostgreSQL</text>
  </g>

  <!-- ── gatling-results volume (inside container) ── -->
  <text x="745" y="766" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">gatling-results volume</text>
  <text x="745" y="783" text-anchor="middle" font-size="9" fill="#777">/tmp/gatling-results</text>
  <ellipse cx="745" cy="804" rx="22" ry="7" fill="#bdbdbd"/>
  <rect x="723" y="804" width="44" height="13" fill="#bdbdbd"/>
  <ellipse cx="745" cy="817" rx="22" ry="7" fill="#9e9e9e"/>

  <!-- ── External RIGHT ── all w=180 h=100, cx=1368 -->
  <!-- PostgreSQL — aligns with ExecutionRepository row -->
  <g filter="url(#sh)">
    <rect x="1284" y="160" width="180" height="100" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="1374" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="white">PostgreSQL</text>
    <text x="1374" y="215" text-anchor="middle" font-size="9" fill="#a5d6a7">[Container]  :5432</text>
  </g>

  <!-- Kafka OUT — aligns with ExecutionKafkaProducer row -->
  <g filter="url(#sh)">
    <rect x="1284" y="310" width="180" height="100" rx="10" fill="#f9a825" stroke="#f57f17" stroke-width="1.5"/>
    <text x="1374" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#3e2000">Kafka</text>
    <text x="1374" y="365" text-anchor="middle" font-size="9" fill="#5d3b00">[Container]</text>
    <text x="1374" y="381" text-anchor="middle" font-size="9" fill="#4a2c00">outgoing events</text>
  </g>

  <!-- MongoDB — aligns with LogRepository row -->
  <g filter="url(#sh)">
    <rect x="1284" y="455" width="180" height="100" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="1374" y="493" text-anchor="middle" font-size="12" font-weight="bold" fill="white">MongoDB</text>
    <text x="1374" y="510" text-anchor="middle" font-size="9" fill="#a5d6a7">[Container]  :27017</text>
  </g>

  <!-- Valkey/Redis — aligns with StatusCacheService row -->
  <g filter="url(#sh)">
    <rect x="1284" y="605" width="180" height="100" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="1374" y="643" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Valkey/Redis</text>
    <text x="1374" y="660" text-anchor="middle" font-size="9" fill="#a5d6a7">[Container]  :6379</text>
  </g>

  <!-- MinIO — aligns with gatling-results / pipeline row -->
  <g filter="url(#sh)">
    <rect x="1284" y="745" width="180" height="100" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="1374" y="783" text-anchor="middle" font-size="12" font-weight="bold" fill="white">MinIO</text>
    <text x="1374" y="800" text-anchor="middle" font-size="9" fill="#a5d6a7">[Container]  :9000</text>
  </g>

  <!-- ⑤ LEGEND -->
  <rect x="1490" y="700" width="380" height="155" rx="8" fill="white" stroke="#ddd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1510" y="724" font-size="12" font-weight="bold" fill="#333">Легенда</text>

  <line x1="1510" y1="745" x2="1570" y2="745" stroke="#444" stroke-width="2" marker-end="url(#aF)"/>
  <text x="1580" y="749" font-size="10" fill="#333">Синхронный вызов</text>

  <line x1="1510" y1="771" x2="1570" y2="771" stroke="#666" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#aO)"/>
  <text x="1580" y="775" font-size="10" fill="#333">Асинхронный Kafka [async]</text>

  <line x1="1510" y1="797" x2="1570" y2="797" stroke="#444" stroke-width="2" marker-start="url(#aB)" marker-end="url(#aF)"/>
  <text x="1580" y="801" font-size="10" fill="#333">Чтение / запись ↔</text>

  <rect x="1510" y="816" width="50" height="14" rx="3" fill="#eeeeee" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="1580" y="827" font-size="10" fill="#333">Внешний volume</text>

</svg>
