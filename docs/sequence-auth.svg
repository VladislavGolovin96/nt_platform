<svg viewBox="0 0 1100 1400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowFilled" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowOpen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1100" height="1400" fill="#fafbfd"/>

  <!-- Title -->
  <text x="550" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a2e">Sequence Diagram: Аутентификация</text>
  <text x="550" y="54" text-anchor="middle" font-size="11" fill="#666">NT Platform · UML Sequence Diagram</text>

  <!-- ===== PARTICIPANTS ===== -->
  <!-- X: User=70, ReactSPA=210, APIGateway=360, AuthService=520, PostgreSQL=690, Valkey=870 -->

  <g font-size="10" text-anchor="middle">
    <rect x="20" y="70" width="100" height="44" rx="6" fill="#2d7a4f" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="70" y="90" fill="white" font-weight="bold">User</text>
    <text x="70" y="106" fill="#c8e6c9">[Person]</text>

    <rect x="155" y="70" width="110" height="44" rx="6" fill="#1565C0" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="210" y="90" fill="white" font-weight="bold">React SPA</text>
    <text x="210" y="106" fill="#b3d4ff">:5173</text>

    <rect x="300" y="70" width="120" height="44" rx="6" fill="#1565C0" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="360" y="90" fill="white" font-weight="bold">API Gateway</text>
    <text x="360" y="106" fill="#b3d4ff">:8080</text>

    <rect x="450" y="70" width="140" height="44" rx="6" fill="#1565C0" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="520" y="90" fill="white" font-weight="bold">Auth Service</text>
    <text x="520" y="106" fill="#b3d4ff">:8081</text>

    <rect x="638" y="70" width="104" height="44" rx="6" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="690" y="90" fill="white" font-weight="bold">PostgreSQL</text>
    <text x="690" y="106" fill="#c8e6c9">:5432</text>

    <rect x="808" y="70" width="120" height="44" rx="6" fill="#c62828" stroke="#b71c1c" stroke-width="1.5"/>
    <text x="868" y="90" fill="white" font-weight="bold">Valkey/Redis</text>
    <text x="868" y="106" fill="#ffcdd2">:6379</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4">
    <line x1="70" y1="114" x2="70" y2="1390"/>
    <line x1="210" y1="114" x2="210" y2="1390"/>
    <line x1="360" y1="114" x2="360" y2="1390"/>
    <line x1="520" y1="114" x2="520" y2="1390"/>
    <line x1="690" y1="114" x2="690" y2="1390"/>
    <line x1="868" y1="114" x2="868" y2="1390"/>
  </g>

  <!-- ===== BLOCK 1: LOGIN ===== -->
  <rect x="20" y="130" width="1060" height="370" rx="6" fill="none" stroke="#2d7a4f" stroke-width="2"/>
  <rect x="20" y="130" width="80" height="18" rx="2" fill="#2d7a4f"/>
  <text x="60" y="143" text-anchor="middle" font-size="9.5" fill="white" font-weight="bold">Логин</text>

  <!-- 1. User → React SPA -->
  <line x1="70" y1="165" x2="204" y2="165" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="137" y="158" text-anchor="middle" font-size="9.5">1. ввести username + пароль</text>

  <!-- 2. React SPA → API Gateway -->
  <line x1="210" y1="192" x2="354" y2="192" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="282" y="184" text-anchor="middle" font-size="9.5">2. POST /api/auth/login</text>

  <!-- 3. API Gateway → Auth Service -->
  <line x1="360" y1="218" x2="514" y2="218" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="437" y="210" text-anchor="middle" font-size="9.5">3. POST /auth/login (без JWT)</text>

  <!-- 4. Auth → PostgreSQL -->
  <line x1="520" y1="244" x2="684" y2="244" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="602" y="236" text-anchor="middle" font-size="9.5">4. SELECT user WHERE username = ?</text>

  <!-- 5. PostgreSQL --> Auth (dashed) -->
  <line x1="690" y1="270" x2="526" y2="270" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="608" y="263" text-anchor="middle" font-size="9.5">5. { passwordHash, userId }</text>

  <!-- 6. Auth self-loop BCrypt -->
  <path d="M 520 295 Q 590 295 590 310 Q 590 325 520 325" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
  <text x="598" y="315" font-size="9" fill="#555">6. BCrypt.verify(password, hash)</text>

  <!-- 7. Auth self-loop generate tokens -->
  <path d="M 520 345 Q 590 345 590 360 Q 590 375 520 375" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
  <text x="598" y="366" font-size="9" fill="#555">7. генерировать accessToken (15m) + refreshToken (7d)</text>

  <!-- 8. Auth → PostgreSQL INSERT -->
  <line x1="520" y1="400" x2="684" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="602" y="392" text-anchor="middle" font-size="9.5">8. INSERT refresh_tokens</text>

  <!-- 9. Auth --> React SPA (dashed) -->
  <line x1="520" y1="430" x2="216" y2="430" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="368" y="422" text-anchor="middle" font-size="9.5">9. { accessToken, refreshToken }</text>

  <!-- 10. React SPA self-loop -->
  <path d="M 210 455 Q 278 455 278 468 Q 278 481 210 481" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
  <text x="284" y="472" font-size="9" fill="#555">10. сохранить в localStorage</text>

  <!-- ===== BLOCK 2: AUTHORIZED REQUEST ===== -->
  <rect x="20" y="515" width="1060" height="270" rx="6" fill="none" stroke="#1565C0" stroke-width="2"/>
  <rect x="20" y="515" width="190" height="18" rx="2" fill="#1565C0"/>
  <text x="115" y="528" text-anchor="middle" font-size="9.5" fill="white" font-weight="bold">Следующие запросы с токеном</text>

  <!-- 11. User → React SPA -->
  <line x1="70" y1="550" x2="204" y2="550" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="137" y="542" text-anchor="middle" font-size="9.5">11. перейти на /projects</text>

  <!-- 12. React SPA → API Gateway -->
  <line x1="210" y1="574" x2="354" y2="574" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="282" y="566" text-anchor="middle" font-size="9.5">12. GET /api/projects [Bearer token]</text>

  <!-- 13. API Gateway → Auth validate -->
  <line x1="360" y1="598" x2="514" y2="598" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="437" y="590" text-anchor="middle" font-size="9.5">13. GET /auth/validate</text>

  <!-- 14. Auth → Valkey/Redis -->
  <line x1="520" y1="622" x2="862" y2="622" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="691" y="614" text-anchor="middle" font-size="9.5">14. GET jwt:blacklist:{token}</text>

  <!-- 15. Valkey --> Auth (dashed) -->
  <line x1="868" y1="646" x2="526" y2="646" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="697" y="638" text-anchor="middle" font-size="9.5">15. (не найден → OK)</text>

  <!-- 16. Auth self-loop verify JWT -->
  <path d="M 520 668 Q 590 668 590 681 Q 590 694 520 694" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
  <text x="598" y="685" font-size="9" fill="#555">16. верифицировать подпись JWT</text>

  <!-- 17. Auth --> API Gateway -->
  <line x1="520" y1="714" x2="366" y2="714" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="443" y="707" text-anchor="middle" font-size="9.5">17. 200 OK { userId, username }</text>

  <!-- 18. API Gateway self-loop -->
  <path d="M 360 734 Q 428 734 428 747 Q 428 760 360 760" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
  <text x="434" y="751" font-size="9" fill="#555">18. добавить X-User-Id в заголовок</text>

  <!-- 19. API Gateway → Project Service (simplified) -->
  <line x1="360" y1="775" x2="514" y2="775" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="437" y="767" text-anchor="middle" font-size="9.5">19. GET /projects (X-User-Id: ...)</text>

  <!-- 20. Project Service --> React SPA (dashed) -->
  <line x1="520" y1="800" x2="216" y2="800" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="368" y="793" text-anchor="middle" font-size="9.5">20. список проектов</text>

  <!-- ===== BLOCK 3: TOKEN REFRESH ===== -->
  <rect x="20" y="825" width="1060" height="210" rx="6" fill="none" stroke="#f57f17" stroke-width="2"/>
  <rect x="20" y="825" width="155" height="18" rx="2" fill="#f57f17"/>
  <text x="97" y="838" text-anchor="middle" font-size="9.5" fill="white" font-weight="bold">Access token истёк</text>

  <!-- 21. React SPA → API Gateway -->
  <line x1="210" y1="860" x2="354" y2="860" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="282" y="852" text-anchor="middle" font-size="9.5">21. POST /api/auth/refresh { refreshToken }</text>

  <!-- 22. API Gateway → Auth -->
  <line x1="360" y1="884" x2="514" y2="884" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="437" y="876" text-anchor="middle" font-size="9.5">22. POST /auth/refresh</text>

  <!-- 23. Auth → PostgreSQL -->
  <line x1="520" y1="908" x2="684" y2="908" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="602" y="900" text-anchor="middle" font-size="9">23. SELECT token WHERE hash=? AND expiresAt>now()</text>

  <!-- 24. PostgreSQL --> Auth (dashed) -->
  <line x1="690" y1="932" x2="526" y2="932" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="608" y="924" text-anchor="middle" font-size="9.5">24. { userId }</text>

  <!-- 25. Auth self-loop new accessToken -->
  <path d="M 520 952 Q 590 952 590 965 Q 590 978 520 978" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
  <text x="598" y="969" font-size="9" fill="#555">25. сгенерировать новый accessToken</text>

  <!-- 26. Auth --> React SPA (dashed) -->
  <line x1="520" y1="1000" x2="216" y2="1000" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="368" y="993" text-anchor="middle" font-size="9.5">26. { accessToken }</text>

  <!-- ===== BLOCK 4: LOGOUT ===== -->
  <rect x="20" y="1030" width="1060" height="200" rx="6" fill="none" stroke="#c62828" stroke-width="2"/>
  <rect x="20" y="1030" width="65" height="18" rx="2" fill="#c62828"/>
  <text x="52" y="1043" text-anchor="middle" font-size="9.5" fill="white" font-weight="bold">Logout</text>

  <!-- 27. User → React SPA -->
  <line x1="70" y1="1065" x2="204" y2="1065" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="137" y="1057" text-anchor="middle" font-size="9.5">27. нажать "Выйти"</text>

  <!-- 28. React SPA → API Gateway -->
  <line x1="210" y1="1090" x2="354" y2="1090" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="282" y="1082" text-anchor="middle" font-size="9.5">28. POST /api/auth/logout [Bearer token]</text>

  <!-- 29. API Gateway → Auth -->
  <line x1="360" y1="1115" x2="514" y2="1115" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="437" y="1107" text-anchor="middle" font-size="9.5">29. POST /auth/logout</text>

  <!-- 30. Auth → Valkey SET blacklist -->
  <line x1="520" y1="1140" x2="862" y2="1140" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="691" y="1132" text-anchor="middle" font-size="9.5">30. SET jwt:blacklist:{token} TTL=remaining</text>

  <!-- 31. Auth --> React SPA (dashed) -->
  <line x1="520" y1="1170" x2="216" y2="1170" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="368" y="1162" text-anchor="middle" font-size="9.5">31. 200 OK</text>

  <!-- 32. React SPA self-loop -->
  <path d="M 210 1190 Q 278 1190 278 1203 Q 278 1216 210 1216" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
  <text x="284" y="1207" font-size="9" fill="#555">32. очистить localStorage, редирект /login</text>

  <!-- Legend -->
  <rect x="20" y="1258" width="440" height="60" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="36" y="1278" font-size="10" font-weight="bold" fill="#333">Легенда:</text>
  <line x1="90" y1="1274" x2="130" y2="1274" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="135" y="1278" font-size="9">синхронный вызов</text>
  <line x1="260" y1="1274" x2="300" y2="1274" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="305" y="1278" font-size="9">ответ (dashed)</text>
  <line x1="90" y1="1300" x2="130" y2="1300" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
  <path d="M 90 1300 Q 130 1300 130 1307 Q 130 1314 90 1314" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="135" y="1310" font-size="9">self-loop (внутренняя обработка)</text>
</svg>
