<svg viewBox="0 0 1400 1500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowFilled" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowOpen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
    <marker id="arrowFilledBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
  </defs>

  <rect width="1400" height="1500" fill="#fafbfd"/>

  <!-- Title -->
  <text x="700" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a2e">Sequence Diagram: Запуск нагрузочного теста и генерация PDF-отчёта</text>
  <text x="700" y="54" text-anchor="middle" font-size="11" fill="#666">NT Platform · UML Sequence Diagram</text>

  <!-- ===== PARTICIPANTS ===== -->
  <!-- X positions for lifeline centers -->
  <!-- User=80, ReactSPA=210, APIGateway=355, ExecService=510, Kafka=660, ReportService=820, NotifService=990, MinIO=1150, GatlingVol=1320 -->

  <g font-size="10" text-anchor="middle">
    <!-- User -->
    <rect x="30" y="70" width="100" height="44" rx="6" fill="#2d7a4f" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="80" y="90" fill="white" font-weight="bold">User</text>
    <text x="80" y="106" fill="#c8e6c9">[Person]</text>

    <!-- React SPA -->
    <rect x="155" y="70" width="110" height="44" rx="6" fill="#1565C0" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="210" y="90" fill="white" font-weight="bold">React SPA</text>
    <text x="210" y="106" fill="#b3d4ff">:5173</text>

    <!-- API Gateway -->
    <rect x="295" y="70" width="120" height="44" rx="6" fill="#1565C0" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="355" y="90" fill="white" font-weight="bold">API Gateway</text>
    <text x="355" y="106" fill="#b3d4ff">:8080</text>

    <!-- Execution Service -->
    <rect x="438" y="70" width="145" height="44" rx="6" fill="#1565C0" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="510" y="90" fill="white" font-weight="bold">Execution Service</text>
    <text x="510" y="106" fill="#b3d4ff">:8083</text>

    <!-- Kafka -->
    <rect x="618" y="70" width="84" height="44" rx="6" fill="#f9a825" stroke="#f57f17" stroke-width="1.5"/>
    <text x="660" y="90" fill="#4a2c00" font-weight="bold">Kafka</text>
    <text x="660" y="106" fill="#5d3b00">:9092</text>

    <!-- Report Service -->
    <rect x="764" y="70" width="114" height="44" rx="6" fill="#1565C0" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="821" y="90" fill="white" font-weight="bold">Report Service</text>
    <text x="821" y="106" fill="#b3d4ff">:8084</text>

    <!-- Notification Service -->
    <rect x="930" y="70" width="120" height="44" rx="6" fill="#1565C0" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="990" y="90" fill="white" font-weight="bold">Notification</text>
    <text x="990" y="106" fill="#b3d4ff">Service :8085</text>

    <!-- MinIO -->
    <rect x="1100" y="70" width="100" height="44" rx="6" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="1150" y="90" fill="white" font-weight="bold">MinIO</text>
    <text x="1150" y="106" fill="#c8e6c9">:9000</text>

    <!-- gatling-results -->
    <rect x="1258" y="70" width="120" height="44" rx="6" fill="#757575" stroke="#616161" stroke-width="1.5"/>
    <text x="1318" y="88" fill="white" font-weight="bold" font-size="9">gatling-results</text>
    <text x="1318" y="104" fill="#e0e0e0" font-size="9">volume</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4">
    <line x1="80" y1="114" x2="80" y2="1480"/>
    <line x1="210" y1="114" x2="210" y2="1480"/>
    <line x1="355" y1="114" x2="355" y2="1480"/>
    <line x1="510" y1="114" x2="510" y2="1480"/>
    <line x1="660" y1="114" x2="660" y2="1480"/>
    <line x1="821" y1="114" x2="821" y2="1480"/>
    <line x1="990" y1="114" x2="990" y2="1480"/>
    <line x1="1150" y1="114" x2="1150" y2="1480"/>
    <line x1="1318" y1="114" x2="1318" y2="1480"/>
  </g>

  <!-- Activation boxes -->
  <rect x="504" y="180" width="12" height="650" rx="2" fill="#90caf9" opacity="0.7"/>
  <rect x="815" y="920" width="12" height="220" rx="2" fill="#90caf9" opacity="0.7"/>
  <rect x="984" y="960" width="12" height="130" rx="2" fill="#90caf9" opacity="0.7"/>

  <!-- ===== MESSAGES ===== -->
  <g font-size="10" fill="#222">

    <!-- 1. User → React SPA -->
    <line x1="80" y1="150" x2="204" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
    <text x="142" y="144" text-anchor="middle" font-size="9.5">1. нажать "Start Test"</text>

    <!-- 2. React SPA → API Gateway -->
    <line x1="210" y1="175" x2="349" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
    <text x="280" y="168" text-anchor="middle" font-size="9.5">2. POST /api/executions [JWT]</text>

    <!-- 3. API Gateway self-loop -->
    <path d="M 355 200 Q 420 200 420 215 Q 420 230 355 230" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
    <text x="430" y="220" font-size="9" fill="#555">3. проверить JWT + rate limit</text>

    <!-- 4. API Gateway → Execution -->
    <line x1="355" y1="250" x2="504" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
    <text x="430" y="244" text-anchor="middle" font-size="9.5">4. POST /executions</text>

    <!-- 5. Execution self-loop -->
    <path d="M 510 275 Q 575 275 575 290 Q 575 305 510 305" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
    <text x="585" y="296" font-size="9" fill="#555">5. создать запись (PENDING)</text>

    <!-- 6. Execution --> React SPA (dashed, return) -->
    <line x1="510" y1="325" x2="216" y2="325" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
    <text x="360" y="318" text-anchor="middle" font-size="9.5">6. 202 { executionId }</text>

    <!-- 7. Execution → MinIO -->
    <line x1="510" y1="360" x2="1144" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
    <text x="827" y="353" text-anchor="middle" font-size="9.5">7. скачать артефакт</text>

    <!-- 8. MinIO --> Execution (dashed) -->
    <line x1="1150" y1="385" x2="516" y2="385" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
    <text x="827" y="378" text-anchor="middle" font-size="9.5">8. test-classes.tar.gz</text>

    <!-- 9. Execution → Kafka [async] -->
    <line x1="510" y1="415" x2="654" y2="415" stroke="#333" stroke-width="2" marker-end="url(#arrowOpen)"/>
    <text x="582" y="408" text-anchor="middle" font-size="9.5">9. test.started [async]</text>

    <!-- 10. Execution self-loop (Gatling start) -->
    <path d="M 510 440 Q 580 440 580 458 Q 580 476 510 476" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
    <text x="588" y="464" font-size="9" fill="#555">10. запустить Gatling → RUNNING</text>

    <!-- LOOP block -->
    <rect x="70" y="500" width="1310" height="95" rx="4" fill="none" stroke="#888" stroke-width="1.5"/>
    <rect x="70" y="500" width="130" height="18" rx="2" fill="#888"/>
    <text x="135" y="513" text-anchor="middle" font-size="9.5" fill="white" font-weight="bold">loop [каждая строка stdout/stderr]</text>

    <!-- 11. Execution → Kafka async log -->
    <line x1="510" y1="530" x2="654" y2="530" stroke="#333" stroke-width="2" marker-end="url(#arrowOpen)"/>
    <text x="582" y="523" text-anchor="middle" font-size="9">11. test.log.{executionId} { line } [async]</text>

    <!-- 12. Execution self-loop (save to MongoDB) -->
    <path d="M 510 555 Q 578 555 578 568 Q 578 581 510 581" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
    <text x="586" y="572" font-size="9" fill="#555">12. сохранить строку в MongoDB</text>

    <!-- 13. React SPA → API Gateway SSE -->
    <line x1="210" y1="620" x2="349" y2="620" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
    <text x="280" y="612" text-anchor="middle" font-size="9.5">13. GET /executions/{id}/logs [SSE]</text>

    <!-- 14. API Gateway → Execution SSE proxy -->
    <line x1="355" y1="640" x2="504" y2="640" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
    <text x="430" y="633" text-anchor="middle" font-size="9.5">14. SSE proxy</text>

    <!-- 15. Execution --> React SPA stream (dashed) -->
    <line x1="510" y1="660" x2="216" y2="660" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
    <text x="360" y="653" text-anchor="middle" font-size="9.5">15. стримить строки логов ↩</text>

    <!-- Note: Gatling завершился -->
    <rect x="434" y="695" width="190" height="24" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
    <text x="529" y="711" text-anchor="middle" font-size="10" fill="#4a2c00">📝 Gatling завершился</text>

    <!-- 16. Execution → gatling-results -->
    <line x1="510" y1="740" x2="1312" y2="740" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
    <text x="910" y="732" text-anchor="middle" font-size="9.5">16. simulation.log записан</text>

    <!-- 17. Execution self-loop (SUCCESS) -->
    <path d="M 510 760 Q 580 760 580 775 Q 580 790 510 790" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
    <text x="588" y="780" font-size="9" fill="#555">17. статус → SUCCESS</text>

    <!-- 18. Execution → Kafka test.finished [async] -->
    <line x1="510" y1="815" x2="654" y2="815" stroke="#333" stroke-width="2" marker-end="url(#arrowOpen)"/>
    <text x="582" y="808" text-anchor="middle" font-size="9.5">18. test.finished { executionId, resultPath } [async]</text>

    <!-- PAR block -->
    <rect x="70" y="845" width="1310" height="330" rx="4" fill="none" stroke="#4a90d9" stroke-width="2"/>
    <rect x="70" y="845" width="50" height="18" rx="2" fill="#4a90d9"/>
    <text x="95" y="858" text-anchor="middle" font-size="9.5" fill="white" font-weight="bold">par</text>
    <!-- Divider -->
    <line x1="70" y1="1020" x2="1380" y2="1020" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="85" y="1018" font-size="9" fill="#4a90d9">Report Service flow</text>
    <text x="85" y="1036" font-size="9" fill="#4a90d9">Notification Service flow</text>

    <!-- == Report Service == -->
    <!-- 19. Kafka → Report -->
    <line x1="660" y1="875" x2="815" y2="875" stroke="#333" stroke-width="2" marker-end="url(#arrowOpen)"/>
    <text x="737" y="868" text-anchor="middle" font-size="9.5">19. test.finished [async]</text>

    <!-- 20. Report self-loop -->
    <path d="M 821 900 Q 886 900 886 914 Q 886 928 821 928" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
    <text x="893" y="919" font-size="9" fill="#555">20. создать Report (GENERATING)</text>

    <!-- 21. Report → gatling-results -->
    <line x1="821" y1="948" x2="1312" y2="948" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
    <text x="1065" y="940" text-anchor="middle" font-size="9.5">21. прочитать simulation.log</text>

    <!-- 22. gatling-results --> Report (dashed) -->
    <line x1="1318" y1="968" x2="827" y2="968" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
    <text x="1065" y="962" text-anchor="middle" font-size="9.5">22. simulation.log</text>

    <!-- 23. Report self-loop (PDF) -->
    <path d="M 821 985 Q 892 985 892 1000 Q 892 1015 821 1015" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
    <text x="899" y="1005" font-size="9" fill="#555">23. перцентили + PDF (iText 7)</text>

    <!-- 24. Report → MinIO -->
    <line x1="821" y1="875" x2="1144" y2="875" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>

    <!-- == Notification Service (bottom par) == -->
    <!-- 27. Kafka → Notification (test.finished) -->
    <line x1="660" y1="1055" x2="984" y2="1055" stroke="#333" stroke-width="2" marker-end="url(#arrowOpen)"/>
    <text x="822" y="1048" text-anchor="middle" font-size="9.5">27. test.finished [async]</text>

    <!-- 28a. Notification self-loop -->
    <path d="M 990 1075 Q 1058 1075 1058 1090 Q 1058 1105 990 1105" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
    <text x="1065" y="1096" font-size="9" fill="#555">28. отправить уведомление (email/webhook)</text>

    <!-- 28b. Kafka → Notification (report.generated) -->
    <line x1="660" y1="1130" x2="984" y2="1130" stroke="#333" stroke-width="2" marker-end="url(#arrowOpen)"/>
    <text x="822" y="1122" text-anchor="middle" font-size="9.5">28. report.generated [async]</text>

    <!-- 29. Notification self-loop -->
    <path d="M 990 1150 Q 1058 1150 1058 1164 Q 1058 1178 990 1178" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowFilled)"/>
    <text x="1065" y="1169" font-size="9" fill="#555">29. отправить письмо со ссылкой на PDF</text>

    <!-- Report: steps 24-26 (inside par upper half) -->
    <!-- 24 already drawn above, add label -->
    <text x="982" y="868" text-anchor="middle" font-size="9.5">24. загрузить PDF → reports/</text>

    <!-- 25. Report self-loop READY -->
    <path d="M 821 875" fill="none"/>

    <!-- Report → Kafka report.generated -->
    <line x1="821" y1="1005" x2="666" y2="1005" stroke="#333" stroke-width="2" marker-end="url(#arrowOpen)"/>
    <text x="743" y="997" text-anchor="middle" font-size="9.5">26. report.generated [async]</text>

    <!-- Report self-loop READY -->
    <path d="M 821 980 Q 886 980 886 985" fill="none" stroke="#333" stroke-width="0"/>
    <text x="89" y="860" font-size="9" fill="#4a90d9">⬆ par upper</text>

  </g>

  <!-- After par block -->
  <!-- 30. User → React SPA -->
  <line x1="80" y1="1210" x2="204" y2="1210" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="142" y="1202" text-anchor="middle" font-size="9.5">30. открыть страницу отчёта</text>

  <!-- 31. React SPA → API Gateway -->
  <line x1="210" y1="1240" x2="349" y2="1240" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="280" y="1232" text-anchor="middle" font-size="9.5">31. GET /api/reports/{executionId}/download</text>

  <!-- 32. API Gateway → Report Service -->
  <line x1="355" y1="1270" x2="815" y2="1270" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="585" y="1262" text-anchor="middle" font-size="9.5">32. GET /reports/{executionId}/download</text>

  <!-- 33. Report → MinIO -->
  <line x1="821" y1="1300" x2="1144" y2="1300" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="982" y="1292" text-anchor="middle" font-size="9.5">33. сгенерировать presigned URL</text>

  <!-- 34. MinIO --> Report (dashed) -->
  <line x1="1150" y1="1325" x2="827" y2="1325" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="982" y="1318" text-anchor="middle" font-size="9.5">34. presigned URL</text>

  <!-- 35. Report --> React SPA (dashed) -->
  <line x1="821" y1="1355" x2="216" y2="1355" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="515" y="1347" text-anchor="middle" font-size="9.5">35. presigned URL</text>

  <!-- 36. React SPA → MinIO -->
  <line x1="210" y1="1390" x2="1144" y2="1390" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="677" y="1382" text-anchor="middle" font-size="9.5">36. GET presigned URL</text>

  <!-- 37. MinIO --> User (dashed) -->
  <line x1="1150" y1="1420" x2="86" y2="1420" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="618" y="1412" text-anchor="middle" font-size="9.5">37. PDF-файл</text>

  <!-- Legend -->
  <rect x="20" y="1440" width="400" height="50" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="35" y="1458" font-size="10" font-weight="bold" fill="#333">Легенда:</text>
  <line x1="90" y1="1454" x2="130" y2="1454" stroke="#333" stroke-width="2" marker-end="url(#arrowFilled)"/>
  <text x="135" y="1458" font-size="9">синхронный</text>
  <line x1="210" y1="1454" x2="250" y2="1454" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
  <text x="255" y="1458" font-size="9">ответ / return</text>
  <line x1="90" y1="1476" x2="130" y2="1476" stroke="#333" stroke-width="2" marker-end="url(#arrowOpen)"/>
  <text x="135" y="1480" font-size="9">async Kafka</text>
  <rect x="210" y="1466" width="50" height="16" rx="2" fill="#4a90d9" opacity="0.3" stroke="#4a90d9" stroke-width="1"/>
  <text x="268" y="1478" font-size="9">par block</text>
</svg>
