spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/loadtest
    username: loadtest
    password: loadtest
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_auth_history
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

jwt:
  secret: local-dev-secret-32-chars-minimum-padding!!
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.loadtest: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASS}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

jwt:
  secret: ${JWT_SECRET}

logging:
  pattern:
    console: '{"time":"%d","level":"%p","service":"auth-service","msg":"%m"}%n'
