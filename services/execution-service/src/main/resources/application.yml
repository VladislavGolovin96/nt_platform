spring:
  application:
    name: execution-service
  datasource:
    url: jdbc:postgresql://localhost:5432/loadtest
    username: loadtest
    password: loadtest
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_execution_history
    baseline-on-migrate: true
    baseline-version: 0
  data:
    mongodb:
      uri: mongodb://localhost:27017/loadtest
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: execution-service-group
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.loadtest.*"
        spring.json.value.default.type: com.loadtest.common.kafka.event.ProjectBuiltEvent

server:
  port: 8083

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-artifacts: artifacts

gatling:
  home: /opt/gatling
  version: ${GATLING_VERSION:3.10.5}
  # Override with a direct URL if Maven Central bundle is unavailable
  download-url: https://repo1.maven.org/maven2/io/gatling/highcharts/gatling-charts-highcharts-bundle/${gatling.version}/gatling-charts-highcharts-bundle-${gatling.version}-bundle.zip
  results-dir: /tmp/gatling-results

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.loadtest: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASS}
  data:
    mongodb:
      uri: ${MONGO_URI}
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

logging:
  pattern:
    console: '{"time":"%d","level":"%p","service":"execution-service","msg":"%m"}%n'
