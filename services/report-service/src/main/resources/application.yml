spring:
  application:
    name: report-service
  datasource:
    url: jdbc:postgresql://localhost:5432/loadtest
    username: loadtest
    password: loadtest
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_report_history
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: report-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.loadtest.*"
        spring.json.value.default.type: com.loadtest.common.kafka.event.TestFinishedEvent

server:
  port: 8084

minio:
  endpoint: http://localhost:9000
  public-endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-reports: reports

grafana:
  url: http://localhost:3000
  token: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:changeme}
  dashboard-uid: ${GRAFANA_DASHBOARD_UID:load-test-dashboard}

prometheus:
  url: http://localhost:9090

report:
  threshold:
    p95-ms: ${REPORT_THRESHOLD_P95_MS:2000}
    error-rate: ${REPORT_THRESHOLD_ERROR_RATE:0.01}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.loadtest: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASS}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}

minio:
  endpoint: ${MINIO_ENDPOINT}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

grafana:
  url: ${GRAFANA_URL}
  token: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}

logging:
  pattern:
    console: '{"time":"%d","level":"%p","service":"report-service","msg":"%m"}%n'
